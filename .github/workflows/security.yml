name: Security and Compatibility

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm run verify

  # Releases are decided by reading commit messages, so a message that does
  # not parse is not a style problem — it is a commit that silently ships
  # nothing. Checking it here means finding out in the pull request rather
  # than wondering later why main stopped producing releases.
  commit-messages:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Every commit follows Conventional Commits
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9/-]+\))?!?: .+'
          bad=0
          while read -r sha; do
            subject=$(git log -1 --format=%s "$sha")
            # Merge commits are generated by GitHub, not written by hand.
            case "$subject" in "Merge "*) continue ;; esac
            if ! printf '%s' "$subject" | grep -qE "$pattern"; then
              echo "::error::not a conventional commit: $subject"
              bad=1
            fi
          done < <(git rev-list origin/${{ github.base_ref }}..HEAD)
          if [ "$bad" -ne 0 ]; then
            echo "Expected e.g. 'fix: correct the style taxonomy' — the prefix is what"
            echo "decides whether a release happens and whether it is a patch or a minor."
            exit 1
          fi
